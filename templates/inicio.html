<!-- templates/inicio.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Tablero de mensajes</title>
</head>
<body>
  <h1>Tablero de mensajes</h1>
  <p>Hay {{ mensajes|length }} mensaje{{ mensajes|length|pluralize }}.</p>
  <ul>
    {% for mensaje in mensajes %}
      <li>{{ mensaje.texto }} <small>({{ mensaje.fecha|date:"j \d\e F, H:i" }})</small></li>
    {% empty %}
      <li>Todavía no hay mensajes.</li>
    {% endfor %}
  </ul>
</body>
</html>
